[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "solo-sdd"
dynamic = ["version"]
description = "Процесс разработки через спецификации: скиллы, правила агентов, схема OpenSpec solo"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = []

[project.urls]
Homepage = "https://github.com/veraetogrex-portfolio/solo-sdd"
Repository = "https://github.com/veraetogrex-portfolio/solo-sdd"
Issues = "https://github.com/veraetogrex-portfolio/solo-sdd/issues"

[project.scripts]
solo-sdd = "solo_sdd.cli:main"

[tool.hatch.version]
path = "solo_sdd/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["solo_sdd"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "solo_sdd/data/skills"
"global" = "solo_sdd/data/global"
"schema" = "solo_sdd/data/schema"
"templates" = "solo_sdd/data/templates"
"targets.json" = "solo_sdd/data/targets.json"
"ALGORITHM.md" = "solo_sdd/data/ALGORITHM.md"
"sync.py" = "solo_sdd/data/sync.py"
