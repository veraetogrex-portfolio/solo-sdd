name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Hypothesis
        run: /usr/bin/python3 -m pip install --user --break-system-packages hypothesis || /usr/bin/python3 -m pip install --user hypothesis
      - name: Run tests
        run: |
          for t in tests/test_*.py schema/test_*.py; do echo "== $t"; /usr/bin/python3 "$t" < /dev/null || exit 1; done
      - name: Wheel install smoke
        run: |
          /usr/bin/python3 -m pip wheel . --no-deps -w dist
          /usr/bin/python3 -m venv "$RUNNER_TEMP/wheelenv"
          "$RUNNER_TEMP/wheelenv/bin/pip" install dist/solo_sdd-*.whl
          "$RUNNER_TEMP/wheelenv/bin/solo-sdd" --version
      - name: npm tarball smoke
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          npm i -g --prefix "$RUNNER_TEMP/npm" "$RUNNER_TEMP"/solo-sdd-*.tgz
          "$RUNNER_TEMP/npm/bin/solo-sdd" --version
